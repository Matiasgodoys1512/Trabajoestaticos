<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Integridad · Equipos Estáticos</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2025.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2025.11.1/core.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="marca">
      <strong>GIEE</strong> · Gestión de Integridad de Equipos Estáticos
      <span class="sub">Prototipo académico MAN040-B</span>
    </div>
    <div class="acciones">
      <button data-act="guardar">Guardar</button>
      <button data-act="exportar">Exportar proyecto</button>
      <label class="boton">Importar proyecto<input type="file" accept=".json" data-act="importar" hidden></label>
      <button data-act="exportar_csv">Exportar CSV</button>
      <button data-act="restablecer" class="secundario">Restablecer caso demo</button>
    </div>
  </header>

  <div id="cargando" class="cargando">
    <div class="spinner"></div>
    <p>Cargando Python en el navegador (Pyodide)…<br><small>La primera carga puede tardar 20–40 s.</small></p>
  </div>

  <div class="layout" id="app" hidden>
    <aside id="sidebar"></aside>
    <main>
      <nav class="tabs" id="tabs">
        <button data-act="tab" data-tab="panel">Panel de resultados</button>
        <button data-act="tab" data-tab="equipo">Equipo y CML</button>
        <button data-act="tab" data-tab="diseno">Diseño y espesores</button>
        <button data-act="tab" data-tab="rbi">Módulo RBI</button>
        <button data-act="tab" data-tab="validacion">Validación</button>
        <button data-act="tab" data-tab="acerca">Alcance y referencias</button>
      </nav>
      <section id="contenido"></section>
    </main>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script type="py" src="py/app.py" config="pyscript.toml"></script>
</body>
</html>
